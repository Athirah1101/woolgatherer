name: FinanceOS scheduled jobs

# Reliable daily triggers for FinanceOS. Vercel Hobby cron jobs fire on a loose
# "best-effort" schedule, so GitHub Actions pokes the app's endpoints on time.
#
# NOTE on timing: GitHub (like all free schedulers) runs scheduled jobs at or
# AFTER the set time, and delays are worst at the top of the hour (:00) when the
# global queue is busiest. We schedule at :09 to dodge that rush so runs land
# close to midnight / noon MYT.
#
# Setup (repo Settings → Secrets and variables → Actions → New repository secret):
#   CRON_SECRET                     — same value as the Vercel env var CRON_SECRET
#   VERCEL_AUTOMATION_BYPASS_SECRET — (optional) Vercel Deployment Protection
#                                     "Protection Bypass for Automation" secret

on:
  # Scheduled triggers are DISABLED — GitHub's free scheduler ran jobs hours late.
  # cron-job.org now hits the /api/cron/* endpoints on time instead. The manual
  # "Run workflow" button below stays as a backup/test trigger (fires all steps).
  # schedule:
  #   - cron: "9 16 * * *"  # ~00:09 MYT — sync bank balances
  #   - cron: "9 4 * * *"   # ~12:09 MYT — daily cash balance to Lark
  #   - cron: "9 4 * * 3,5" # ~12:09 MYT Wed & Fri — payment-arrangement list
  workflow_dispatch: {} # manual "Run workflow" button (fires all, for testing)

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Sync bank balances (midnight MYT)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 16 * * *'
        run: |
          curl -fsS --retry 3 --max-time 120 -X GET \
            "https://finance-os-theta-ten.vercel.app/api/cron/stripe-balance" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"

      - name: Post daily balance to Lark (noon MYT)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 4 * * *'
        run: |
          curl -fsS --retry 3 --max-time 120 -X GET \
            "https://finance-os-theta-ten.vercel.app/api/cron/lark-daily" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"

      - name: Post payment-arrangement list to Lark (Wed & Fri noon MYT)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '9 4 * * 3,5'
        run: |
          curl -fsS --retry 3 --max-time 120 -X GET \
            "https://finance-os-theta-ten.vercel.app/api/cron/lark-payments" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "x-vercel-protection-bypass: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}"
